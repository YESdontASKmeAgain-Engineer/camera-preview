name: Publish Ubuntu Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v1.1.0
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-ubuntu:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset_name: CameraPreview-ubuntu-x86_64
          - runner: ubuntu-22.04-arm
            asset_name: CameraPreview-ubuntu-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verify Ubuntu code path
        run: |
          python -m py_compile camera_preview.py
          python -c 'import camera_preview as app; assert app.BACKENDS[0][0] == "V4L2"; assert app.wintypes is None'

      - name: Build portable application
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          python -m PyInstaller --noconfirm --clean CameraPreview.spec
          dist/CameraPreview/CameraPreview --help >/dev/null
          cp README.md LICENSE dist/CameraPreview/
          tar -C dist -czf "${ASSET_NAME}.tar.gz" CameraPreview
          sha256sum "${ASSET_NAME}.tar.gz" > "${ASSET_NAME}.tar.gz.sha256"

      - name: Store build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-ubuntu
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "Camera Preview $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release/*.tar.gz release/*.tar.gz.sha256 --clobber
